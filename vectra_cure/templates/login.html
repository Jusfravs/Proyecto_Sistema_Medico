{% extends "base.html" %}
{% block titulo %}Iniciar sesión — Vectra Cure{% endblock %}

{% block content %}
<section class="vc-profile"><div class="vc-shell"><div class="vc-narrow-tight">
  <article class="vc-card">
    <p class="vc-eyebrow">Bienvenido de vuelta</p>
    <h1>Iniciar sesión</h1>
    <form class="vc-form" method="post">
      {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
      <label>Correo electrónico
        <input type="email" name="email" autocomplete="email" required></label>
      <label>Contraseña
        <input type="password" name="password" autocomplete="current-password" required></label>
      <button class="vc-button vc-button-block">Ingresar</button>
    </form>
    <p class="vc-data">¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a></p>
  </article>
</div></div></section>
{% endblock %}
