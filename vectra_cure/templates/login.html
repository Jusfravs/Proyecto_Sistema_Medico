{% extends "base.html" %}
{% block titulo %}Iniciar sesión — Vectra Cure{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="vc-card vc-card-lg p-4">
      <h1 class="h4 mb-3">Iniciar sesión</h1>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button class="btn btn-vc w-100">Ingresar</button>
      </form>
      <p class="text-center vc-data mt-3">¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a></p>
    </div>
  </div>
</div>
{% endblock %}
