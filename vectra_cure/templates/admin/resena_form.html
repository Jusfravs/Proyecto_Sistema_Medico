{% extends "base.html" %}
{% block titulo %}Editar reseña #{{ resena.id }} — Admin{% endblock %}

{% block content %}
<section class="vc-profile"><div class="vc-shell"><div class="vc-narrow">
  <a class="vc-back-link" href="{{ url_for('admin_resenas') }}">← Volver</a>

  <article class="vc-card">
    <p class="vc-eyebrow">Administración</p>
    <h1>Editar reseña #{{ resena.id }}</h1>
    <p class="vc-data">Especialista: {{ resena.medico.usuario.nombre }}</p>
    <form class="vc-form" method="post">
      <label>Nombre del paciente
        <input name="paciente_nombre" value="{{ resena.paciente_nombre }}" required></label>
      <label>Calificación
        <select name="calificacion" required>
          {% for n in [5,4,3,2,1] %}<option value="{{ n }}" {{ 'selected' if resena.calificacion == n }}>{{ '★' * n }} ({{ n }})</option>{% endfor %}
        </select></label>
      <label>Comentario
        <textarea name="comentario" rows="3">{{ resena.comentario or '' }}</textarea></label>
      <button class="vc-button">Guardar</button>
    </form>
  </article>
</div></div></section>
{% endblock %}
