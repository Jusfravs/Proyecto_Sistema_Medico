{% extends "base.html" %}
{% block titulo %}Consultar mi cita — Vectra Cure{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="vc-card p-4">
      <h1 class="h4 mb-1">Consultar mi cita</h1>
      <p class="vc-data">Ingresa tu <strong>código de ticket</strong> (ej. <code>VC-2026-8942</code>)
        o tu <strong>número de teléfono</strong>.</p>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Código de ticket o teléfono</label>
          <input name="criterio" class="form-control form-control-lg" placeholder="VC-2026-8942" required>
        </div>
        <button class="btn btn-vc w-100">Buscar cita</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
